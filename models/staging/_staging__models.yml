version: 2

models:
  - name: stg_games
    description: One row per finished regular-season game, from the latest load of that game in GAMES_RAW.
    columns:
      - name: game_id
        data_tests:
          - unique
          - not_null
      - name: season
        description: Season as an 8-digit integer, e.g. 20252026.
        data_tests:
          - not_null
      - name: game_date
        data_tests:
          - not_null
      - name: home_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('NHL_TEAMS')
                field: team_id
      - name: away_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('NHL_TEAMS')
                field: team_id
      - name: last_period_type
        description: How the game ended. REG = regulation, OT = overtime, SO = shootout.
        data_tests:
          - accepted_values:
              arguments:
                values: ['REG', 'OT', 'SO']

  - name: stg_games_pbp
    description: One row per non-shootout goal, from the latest play-by-play load of each game.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'event_id']
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: event_id
        data_tests:
          - not_null
      - name: scoring_player_id
        data_tests:
          - not_null

  - name: stg_players_info
    description: One row per player, from the latest load of that player in PLAYERS_INFO_RAW.
    columns:
      - name: player_id
        data_tests:
          - unique
          - not_null
