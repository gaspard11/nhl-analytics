name: 'nhl_analytics'
version: '1.0.0'
config-version: 2

# Generic test `arguments:` syntax needs dbt 1.10+ (or dbt Fusion)
require-dbt-version: ">=1.10.0"

# Only used by dbt Core; dbt Cloud uses the environment's connection
profile: 'nhl_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Folder-level defaults. A model's own config() overrides them.
# Schemas go through macros/generate_schema_name.sql: as-is in prod, prefixed elsewhere.
models:
  nhl_analytics:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
