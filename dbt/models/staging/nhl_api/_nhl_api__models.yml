version: 2

models:
  - name: stg_nhl_api__games
    description: One row per finished regular-season game, from the latest load of that game in GAMES_RAW.
    columns:
      - name: game_id
        data_tests:
          - unique
          - not_null
      - name: season
        description: "{{ doc('season') }}"
        data_tests:
          - not_null
      - name: game_date
        data_tests:
          - not_null
      - name: home_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('nhl_teams')
                field: team_id
      - name: away_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('nhl_teams')
                field: team_id
      - name: last_period_type
        description: "{{ doc('last_period_type') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['REG', 'OT', 'SO']

  - name: stg_nhl_api__goals
    description: One row per non-shootout goal, from the latest play-by-play load of each game.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'event_id']
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: event_id
        data_tests:
          - not_null
      - name: scoring_player_id
        data_tests:
          - not_null
      - name: situation_code
        description: "{{ doc('situation_code') }}"

  - name: stg_nhl_api__players
    description: One row per player, from the latest load of that player in PLAYERS_INFO_RAW.
    columns:
      - name: player_id
        data_tests:
          - unique
          - not_null
