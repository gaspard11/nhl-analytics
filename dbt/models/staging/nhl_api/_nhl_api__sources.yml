version: 2

sources:
  - name: nhl_raw
    description: Raw JSON payloads from the NHL API, loaded by the Airflow DAG nhl_raw_pipeline. Every load is kept.
    database: NHL_RAW
    schema: RAW
    tables:
      - name: GAMES_RAW
        description: One NHL stats API payload (all regular-season games of one date) per load.
      - name: GAMES_PBP_RAW
        description: One play-by-play payload (one game) per load.
      - name: GAMES_SHIFTS_RAW
        description: >
          One shift chart payload (one game) per load. Daily loads come from the NHL shift API. Every
          earlier game (2025-2026, and 2026-2027 up to mid-November) was loaded from the NHL's HTML
          time-on-ice reports by the one-off DAG backfill_shifts_from_html, in the same format, since
          the API had missing, duplicated and misplaced shifts.
