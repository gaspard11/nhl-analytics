version: 2

models:
  - name: int_team_game_results
    description: One row per team per finished game (home and away sides unioned), with the result from that team's point of view.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'team_id']
    columns:
      - name: points
        description: 2 for a win, 1 for an overtime or shootout loss, 0 for a regulation loss.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: false
      - name: regulation_loss
        description: 1 for a loss in regulation.
      - name: ot_loss
        description: 1 for a loss in overtime or in a shootout.
      - name: shootout_win
        description: 1 for a win in a shootout.
      - name: shootout_loss
        description: 1 for a loss in a shootout.
      - name: result
        description: W for a win, L for a loss in regulation, OT for a loss in overtime or in a shootout.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['W', 'L', 'OT']

  - name: int_league_ranking_pre_tie_breaker
    description: >
      Cumulative state table (incremental): season-to-date totals per team for every game date,
      plus day 0, before the head-to-head tie-breaker.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'ranking_date', 'team_id']
      # Every game is a win, a regulation loss or an OT/SO loss, at home or away
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              total_wins + regulation_losses + ot_losses = games_played
              and home_wins + away_wins = total_wins
              and home_regulation_losses + away_regulation_losses = regulation_losses
              and home_ot_losses + away_ot_losses = ot_losses
              and shootout_wins <= total_wins
              and shootout_losses <= ot_losses
      # The last 10 games are the last 10 played, or all of them before the 10th
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              last_10_wins + last_10_regulation_losses + last_10_ot_losses = least(games_played, 10)
              and coalesce(streak_length, 0) <= games_played
              and (streak_result is null) = (games_played = 0)
    columns:
      - name: regulation_losses
        description: Season-to-date losses in regulation.
      - name: ot_losses
        description: Season-to-date losses in overtime or in a shootout.
      - name: home_wins
        description: Season-to-date wins at home, shootout wins included.
      - name: home_regulation_losses
        description: Season-to-date losses in regulation at home.
      - name: home_ot_losses
        description: Season-to-date losses in overtime or in a shootout at home.
      - name: away_wins
        description: Season-to-date wins away, shootout wins included.
      - name: away_regulation_losses
        description: Season-to-date losses in regulation away.
      - name: away_ot_losses
        description: Season-to-date losses in overtime or in a shootout away.
      - name: shootout_wins
        description: Season-to-date wins in a shootout.
      - name: shootout_losses
        description: Season-to-date losses in a shootout.
      - name: last_10_wins
        description: >
          Wins in the team's last 10 games up to that day (all its games before the 10th). Not a
          running total: recomputed from the game history for each day of the batch.
      - name: last_10_regulation_losses
        description: Losses in regulation in the team's last 10 games up to that day.
      - name: last_10_ot_losses
        description: Losses in overtime or in a shootout in the team's last 10 games up to that day.
      - name: last_10_results
        description: >
          The results of the team's last 10 games up to that day, oldest first, comma separated
          (for example W,W,L,OT,W). Null before its first game.
      - name: streak_result
        description: Result of the team's last game up to that day (W, L or OT). Null before its first game.
        data_tests:
          - accepted_values:
              arguments:
                values: ['W', 'L', 'OT']
      - name: streak_length
        description: Number of games in a row with streak_result, ending with the last game. Null before the first game.
      - name: tie_group_id
        description: >
          Shared by teams equal on points, games played, regulation wins, regulation + OT wins
          and total wins on the same day. Null when the team is not tied.

  - name: int_tied_teams_rate
    description: >
      Head-to-head points % of each tied team against the other teams of its tie group,
      in games played so far this season. Odd series exclude one game (NHL rule).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'ranking_date', 'tie_group_id', 'team_id']
    columns:
      - name: tie_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  # Per-game player stats, long format: one row per game, player and stat. Season-to-date totals
  # are in the marts fct_skater_stats and fct_goalie_stats. int_skater_game_stats (skater-only
  # stats) is disabled until its first stat is written; its tests go here once it is enabled.

  - name: int_player_game_stats
    description: >
      Stats common to skaters and goalies, per game: one row per game, player and stat (long format).
      `toi_seconds` (time on ice, from the shifts: a row means a game played), `goals` and `assists`
      (shootout goals excluded). A player with no row for a stat had none of it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'player_id', 'stat_name']
      - dbt_utils.expression_is_true:
          arguments:
            expression: "stat_value >= 0"
      # A player plays at most a full game: 60 minutes plus 5 minutes of overtime
      - dbt_utils.expression_is_true:
          arguments:
            expression: "stat_value <= 3900"
          config:
            where: "stat_name = 'toi_seconds'"
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_tests:
          - not_null
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: stat_name
        description: >
          `toi_seconds`: seconds on the ice, the sum of the player's shifts. `goals`, `assists`: goals
          and assists (first and second) in the game, shootout excluded.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['toi_seconds', 'goals', 'assists']
      - name: stat_value
        description: Value of the stat, a count (seconds for `toi_seconds`).
      - name: fetched_at
        description: >
          Latest load of the game among its game row, its play-by-play and its shifts: a reload of any
          of the three recomputes the game downstream.
        data_tests:
          - not_null

  - name: int_goalie_game_stats
    description: >
      Goalie-only stats, per game: one row per game, goalie and stat (long format): `saves`,
      `goals_against` and `shutout`. Shootouts are left out, and empty net goals are charged to no
      goalie. A goalie with no row for a stat had none of it (`shutout` only has a row, worth 1, when
      the goalie got one). Time on ice and games played are in int_player_game_stats.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'player_id', 'stat_name']
      - dbt_utils.expression_is_true:
          arguments:
            expression: "stat_value >= 0"
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_tests:
          - not_null
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: stat_name
        description: >
          `saves`: shots on goal stopped. `goals_against`: goals allowed with the goalie in net.
          `shutout`: 1 when the goalie was the only one used by their team and the team allowed no
          goal, shootout excluded (so the loser of a game that is 0-0 until the shootout gets one too).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['saves', 'goals_against', 'shutout']
      - name: stat_value
        description: Value of the stat, a count.
      - name: fetched_at
        description: >
          Latest load of the game among its game row, its play-by-play and its shifts: a reload of any
          of the three recomputes the game downstream.
        data_tests:
          - not_null
