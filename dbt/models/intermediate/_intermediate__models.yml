version: 2

models:
  - name: int_team_game_results
    description: One row per team per finished game (home and away sides unioned), with the result from that team's point of view.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'team_id']
    columns:
      - name: points
        description: 2 for a win, 1 for an overtime or shootout loss, 0 for a regulation loss.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: false
      - name: regulation_loss
        description: 1 for a loss in regulation.
      - name: ot_loss
        description: 1 for a loss in overtime or in a shootout.
      - name: shootout_win
        description: 1 for a win in a shootout.
      - name: shootout_loss
        description: 1 for a loss in a shootout.
      - name: result
        description: W for a win, L for a loss in regulation, OT for a loss in overtime or in a shootout.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['W', 'L', 'OT']

  - name: int_league_ranking_pre_tie_breaker
    description: >
      Cumulative state table (incremental): season-to-date totals per team for every game date,
      plus day 0, before the head-to-head tie-breaker.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'ranking_date', 'team_id']
      # Every game is a win, a regulation loss or an OT/SO loss, at home or away
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              total_wins + regulation_losses + ot_losses = games_played
              and home_wins + away_wins = total_wins
              and home_regulation_losses + away_regulation_losses = regulation_losses
              and home_ot_losses + away_ot_losses = ot_losses
              and shootout_wins <= total_wins
              and shootout_losses <= ot_losses
      # The last 10 games are the last 10 played, or all of them before the 10th
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              last_10_wins + last_10_regulation_losses + last_10_ot_losses = least(games_played, 10)
              and coalesce(streak_length, 0) <= games_played
              and (streak_result is null) = (games_played = 0)
    columns:
      - name: regulation_losses
        description: Season-to-date losses in regulation.
      - name: ot_losses
        description: Season-to-date losses in overtime or in a shootout.
      - name: home_wins
        description: Season-to-date wins at home, shootout wins included.
      - name: home_regulation_losses
        description: Season-to-date losses in regulation at home.
      - name: home_ot_losses
        description: Season-to-date losses in overtime or in a shootout at home.
      - name: away_wins
        description: Season-to-date wins away, shootout wins included.
      - name: away_regulation_losses
        description: Season-to-date losses in regulation away.
      - name: away_ot_losses
        description: Season-to-date losses in overtime or in a shootout away.
      - name: shootout_wins
        description: Season-to-date wins in a shootout.
      - name: shootout_losses
        description: Season-to-date losses in a shootout.
      - name: last_10_wins
        description: >
          Wins in the team's last 10 games up to that day (all its games before the 10th). Not a
          running total: recomputed from the game history for each day of the batch.
      - name: last_10_regulation_losses
        description: Losses in regulation in the team's last 10 games up to that day.
      - name: last_10_ot_losses
        description: Losses in overtime or in a shootout in the team's last 10 games up to that day.
      - name: streak_result
        description: Result of the team's last game up to that day (W, L or OT). Null before its first game.
        data_tests:
          - accepted_values:
              arguments:
                values: ['W', 'L', 'OT']
      - name: streak_length
        description: Number of games in a row with streak_result, ending with the last game. Null before the first game.
      - name: tie_group_id
        description: >
          Shared by teams equal on points, games played, regulation wins, regulation + OT wins
          and total wins on the same day. Null when the team is not tied.

  - name: int_tied_teams_rate
    description: >
      Head-to-head points % of each tied team against the other teams of its tie group,
      in games played so far this season. Odd series exclude one game (NHL rule).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'ranking_date', 'tie_group_id', 'team_id']
    columns:
      - name: tie_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: int_player_scoring_cumulative
    description: >
      Cumulative state table (incremental): season-to-date goals and assists per player for every
      game date, from the player's first point of the season.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'ranking_date', 'player_id']
    columns:
      - name: number_of_points
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
