version: 2

models:
  - name: int_team_game_results
    description: One row per team per finished game (home and away sides unioned), with the result from that team's point of view.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'team_id']
    columns:
      - name: points
        description: 2 for a win, 1 for an overtime or shootout loss, 0 for a regulation loss.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: false
      - name: regulation_loss
        description: 1 for a loss in regulation.
      - name: ot_loss
        description: 1 for a loss in overtime or in a shootout.
      - name: shootout_win
        description: 1 for a win in a shootout.
      - name: shootout_loss
        description: 1 for a loss in a shootout.
      - name: result
        description: W for a win, L for a loss in regulation, OT for a loss in overtime or in a shootout.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['W', 'L', 'OT']

  - name: int_league_ranking_pre_tie_breaker
    description: >
      Cumulative state table (incremental): season-to-date totals per team for every game date,
      plus day 0, before the head-to-head tie-breaker.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'ranking_date', 'team_id']
      # Every game is a win, a regulation loss or an OT/SO loss, at home or away
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              total_wins + regulation_losses + ot_losses = games_played
              and home_wins + away_wins = total_wins
              and home_regulation_losses + away_regulation_losses = regulation_losses
              and home_ot_losses + away_ot_losses = ot_losses
              and shootout_wins <= total_wins
              and shootout_losses <= ot_losses
      # The last 10 games are the last 10 played, or all of them before the 10th
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              last_10_wins + last_10_regulation_losses + last_10_ot_losses = least(games_played, 10)
              and coalesce(streak_length, 0) <= games_played
              and (streak_result is null) = (games_played = 0)
    columns:
      - name: regulation_losses
        description: Season-to-date losses in regulation.
      - name: ot_losses
        description: Season-to-date losses in overtime or in a shootout.
      - name: home_wins
        description: Season-to-date wins at home, shootout wins included.
      - name: home_regulation_losses
        description: Season-to-date losses in regulation at home.
      - name: home_ot_losses
        description: Season-to-date losses in overtime or in a shootout at home.
      - name: away_wins
        description: Season-to-date wins away, shootout wins included.
      - name: away_regulation_losses
        description: Season-to-date losses in regulation away.
      - name: away_ot_losses
        description: Season-to-date losses in overtime or in a shootout away.
      - name: shootout_wins
        description: Season-to-date wins in a shootout.
      - name: shootout_losses
        description: Season-to-date losses in a shootout.
      - name: last_10_wins
        description: >
          Wins in the team's last 10 games up to that day (all its games before the 10th). Not a
          running total: recomputed from the game history for each day of the batch.
      - name: last_10_regulation_losses
        description: Losses in regulation in the team's last 10 games up to that day.
      - name: last_10_ot_losses
        description: Losses in overtime or in a shootout in the team's last 10 games up to that day.
      - name: last_10_results
        description: >
          The results of the team's last 10 games up to that day, oldest first, comma separated
          (for example W,W,L,OT,W). Null before its first game.
      - name: streak_result
        description: Result of the team's last game up to that day (W, L or OT). Null before its first game.
        data_tests:
          - accepted_values:
              arguments:
                values: ['W', 'L', 'OT']
      - name: streak_length
        description: Number of games in a row with streak_result, ending with the last game. Null before the first game.
      - name: tie_group_id
        description: >
          Shared by teams equal on points, games played, regulation wins, regulation + OT wins
          and total wins on the same day. Null when the team is not tied.

  - name: int_tied_teams_rate
    description: >
      Head-to-head points % of each tied team against the other teams of its tie group,
      in games played so far this season. Odd series exclude one game (NHL rule).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'ranking_date', 'tie_group_id', 'team_id']
    columns:
      - name: tie_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: int_goals_situations
    description: >
      One row per goal of a finished game, shootout goals excluded, with its situation from the scoring
      team's point of view: who had more skaters (strength_situation), which net was empty
      (net_situation) and the skaters on each side (strength), all worked out from situation_code.
      Read by fct_goals and by the player stats (EV / PP / SH splits, +/-, goalie decisions).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'event_id']
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_tests:
          - not_null
      - name: event_id
        description: Id of the goal event within the game's play-by-play.
        data_tests:
          - not_null
      - name: team_id
        description: Team that scored the goal. Joins to `dim_teams.team_id`.
      - name: situation_code
        description: "{{ doc('situation_code') }}"
      - name: home_score
        description: Home team score right after this goal.
      - name: away_score
        description: Away team score right after this goal.
      - name: scoring_player_id
        description: Player who scored. Joins to `dim_players.player_id`.
      - name: assist1_player_id
        description: Player credited with the first assist. Null for an unassisted goal.
      - name: assist2_player_id
        description: Player credited with the second assist. Null when there is at most one assist.
      - name: period_number
        description: Period of the goal (1-3 = regulation, 4 = overtime).
      - name: time_in_period
        description: Time elapsed in the period when the goal was scored, as `MM:SS`.
      - name: time_remaining_in_period
        description: Time left in the period when the goal was scored, as `MM:SS`.
      - name: fetched_at
        description: "{{ doc('fetched_at') }}"
      - name: strength_situation
        description: >
          Who had more skaters, from the scoring team's point of view. PS = penalty shot, PP = power
          play, SH = short handed, EV = even strength. The extra skater of a pulled goalie is taken off
          both sides first, so a goal into the empty net of a penalised team is PP.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PS', 'PP', 'SH', 'EV']
      - name: net_situation
        description: >
          Which net was empty, from the scoring team's point of view. EN = empty net (the other team had
          pulled its goalie), EA = extra attacker (the scoring team had pulled its goalie), NORMAL = both
          goalies in. Independent of strength_situation.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EN', 'EA', 'NORMAL']
      - name: strength
        description: >
          Skaters on the ice when the goal was scored, scoring team first, e.g. `5 on 4`. Goalies are not
          counted, so a team with its goalie pulled shows 6 skaters. `Penalty shot` for a penalty shot goal.

  # Per-game player stats, long format: one row per game, player and stat, in three families (common
  # to every player, skater only, goalie only). Season-to-date totals are in the marts
  # fct_skater_stats and fct_goalie_stats.

  - name: int_player_game_stats
    description: >
      Stats common to skaters and goalies, per game: one row per game, player and stat (long format).
      A player with no row for a stat had none of it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'player_id', 'stat_name']
      - dbt_utils.expression_is_true:
          arguments:
            expression: "stat_value >= 0"
      # A player plays at most a full game: 60 minutes plus 5 minutes of overtime
      - dbt_utils.expression_is_true:
          arguments:
            expression: "stat_value <= 3900"
          config:
            where: "stat_name = 'toi_seconds'"
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_tests:
          - not_null
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: stat_name
        description: >
          `toi_seconds`: seconds on the ice, the sum of the player's shifts (a row means a game played).
          `goals`, `assists`: goals and assists (first and second), shootout excluded.
          `penalty_minutes`: the duration of the penalties the player committed; bench minors, charged to
          no player, and penalty shots (0 minutes) add nothing.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['toi_seconds', 'goals', 'assists', 'penalty_minutes']
      - name: stat_value
        description: Value of the stat, a count (seconds for `toi_seconds`, minutes for `penalty_minutes`).
      - name: fetched_at
        description: >
          Latest load of the game among its game row, its play-by-play and its shifts: a reload of any
          of the three recomputes the game downstream.
        data_tests:
          - not_null

  - name: int_skater_game_stats
    description: >
      Skater-only stats, per game: one row per game, skater and stat (long format). A skater with no row
      for a stat had none of it. The goal splits and +/- come from int_goals_situations.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'player_id', 'stat_name']
      # Every stat is a count, except +/- which can be negative
      - dbt_utils.expression_is_true:
          arguments:
            expression: "stat_value >= 0"
          config:
            where: "stat_name <> 'plus_minus'"
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_tests:
          - not_null
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: stat_name
        description: >
          `shots`: shots on goal (the `shot-on-goal` and `goal` events of the player), shootout excluded.
          `ev_goals`, `ev_assists`, `pp_goals`, `pp_assists`, `sh_goals`, `sh_assists`: goals and assists
          split by the strength_situation of the goal (even strength, power play, short handed).
          `ps_goals`: penalty shot goals (never assisted). `plus_minus`: +1 for each even strength or short
          handed goal of the skater's team while they were on the ice (a shift covering the time of the
          goal), -1 for each one of the other team; power play goals and penalty shots don't count.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['shots', 'ev_goals', 'ev_assists', 'pp_goals', 'pp_assists', 'sh_goals', 'sh_assists', 'ps_goals', 'plus_minus', 'ot_goals', 'gw_goals', 'faceoffs_won', 'faceoffs_lost', 'takeaways', 'giveaways', 'hits', 'blocked-shots', 'number_of_shifts']
      - name: stat_value
        description: Value of the stat, a count, except `plus_minus` which can be negative.
      - name: fetched_at
        description: >
          Latest load of the game among its game row, its play-by-play and its shifts: a reload of any
          of the three recomputes the game downstream.
        data_tests:
          - not_null

  - name: int_goalie_game_stats
    description: >
      Goalie-only stats, per game: one row per game, goalie and stat (long format). Shootouts are left
      out, and empty net goals are charged to no goalie. A goalie with no row for a stat had none of it
      (`shutout`, `games_started` and the decisions only have a row, worth 1, when the goalie got one).
      Time on ice and games played are in int_player_game_stats.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'player_id', 'stat_name']
      - dbt_utils.expression_is_true:
          arguments:
            expression: "stat_value >= 0"
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_tests:
          - not_null
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: stat_name
        description: >
          `saves`: shots on goal stopped. `goals_against`: goals allowed with the goalie in net.
          `shutout`: 1 when the goalie was the only one used by their team and the team allowed no goal,
          shootout excluded (so the loser of a game that is 0-0 until the shootout gets one too).
          `games_started`: 1 for the goalie in net at the opening faceoff (shift starting at 00:00 of
          period 1). `awarded_wins`, `awarded_losses`, `awarded_ot_losses`: the decision, 1 for the
          goalie of record of each team (the goalie whose latest shift started before the game-winning
          goal, or before the end of overtime for a shootout), from the team's result in
          int_team_game_results (W, L, OT).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['saves', 'goals_against', 'shutout', 'games_started', 'awarded_wins', 'awarded_losses', 'awarded_ot_losses', 'ev_goal_against','pp_goal_against','sh_goal_against','ps_goal_against']
      - name: stat_value
        description: Value of the stat, a count.
      - name: fetched_at
        description: >
          Latest load of the game among its game row, its play-by-play and its shifts: a reload of any
          of the three recomputes the game downstream.
        data_tests:
          - not_null
