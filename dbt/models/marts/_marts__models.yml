version: 2

models:
  - name: fct_league_rankings
    description: >
      League standings per day, after every NHL tie-breaker. One row per team per ranking date,
      from day 0 of each season. Cumulative: each row holds season-to-date totals.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'ranking_date', 'team_id']
    columns:
      - name: ranking_date
        description: "{{ doc('ranking_date') }}"
      - name: season
        description: "{{ doc('season') }}"
      - name: ranking
        description: >
          League rank that day (1 = first), after all tie-breakers: points, fewer games played,
          regulation wins, regulation + OT wins, total wins, head-to-head points %, goal differential,
          goals for. Teams still equal after all of them share a rank. On day 0 every team is ranked 32.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 32
      - name: team_id
        description: "{{ doc('team_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: points
        description: Season-to-date points. Win = 2, overtime or shootout loss = 1, regulation loss = 0.
      - name: goals_for
        description: Season-to-date goals scored. A shootout win counts as one goal, as in the NHL standings.
      - name: goals_against
        description: Season-to-date goals conceded. A shootout loss counts as one goal against.
      - name: goal_diff
        description: goals_for - goals_against.
      - name: games_played
        description: Season-to-date games played.
      - name: regulation_wins
        description: Season-to-date wins in regulation (RW).
      - name: regulation_ot_wins
        description: Season-to-date wins in regulation or overtime, i.e. excluding shootout wins (ROW).
      - name: total_wins
        description: Season-to-date wins, including shootout wins.
      - name: tie_rate
        description: >
          Head-to-head points % (between 0 and 1) against the other teams tied with this one on points,
          games played, RW, ROW and wins that day. Only used as a tie-breaker; 0 when the team isn't tied.
      - name: _batch_loaded_at
        description: "{{ doc('batch_loaded_at') }}"

  - name: fct_player_goals_rankings
    description: Goals ranking per day. Only players with at least one goal this season.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'ranking_date', 'player_id']
    columns:
      - name: ranking_date
        description: "{{ doc('ranking_date') }}"
      - name: season
        description: "{{ doc('season') }}"
      - name: ranking
        description: "{{ doc('player_ranking') }}"
        data_tests:
          - not_null
      - name: player_id
        description: "{{ doc('player_id') }}"
      - name: number_of_goals
        description: Season-to-date goals, shootout goals excluded.
      - name: _batch_loaded_at
        description: "{{ doc('batch_loaded_at') }}"

  - name: fct_player_assists_rankings
    description: Assists ranking per day. Only players with at least one assist this season.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'ranking_date', 'player_id']
    columns:
      - name: ranking_date
        description: "{{ doc('ranking_date') }}"
      - name: season
        description: "{{ doc('season') }}"
      - name: ranking
        description: "{{ doc('player_ranking') }}"
        data_tests:
          - not_null
      - name: player_id
        description: "{{ doc('player_id') }}"
      - name: number_of_assists
        description: Season-to-date assists (first and second assists both count).
      - name: _batch_loaded_at
        description: "{{ doc('batch_loaded_at') }}"

  - name: fct_player_points_rankings
    description: Points (goals + assists) ranking per day. Only players with at least one point this season.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'ranking_date', 'player_id']
    columns:
      - name: ranking_date
        description: "{{ doc('ranking_date') }}"
      - name: season
        description: "{{ doc('season') }}"
      - name: ranking
        description: "{{ doc('player_ranking') }}"
        data_tests:
          - not_null
      - name: player_id
        description: "{{ doc('player_id') }}"
      - name: number_of_points
        description: Season-to-date points = goals + assists.
      - name: _batch_loaded_at
        description: "{{ doc('batch_loaded_at') }}"

  - name: fct_games
    description: One row per finished regular-season game.
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_tests:
          - unique
          - not_null
      - name: season
        description: "{{ doc('season') }}"
      - name: game_date
        description: "{{ doc('game_date') }}"
      - name: game_state
        description: NHL game state id. Always 7 (final), since only finished games are kept.
      - name: home_team_id
        description: "{{ doc('team_id') }}"
      - name: home_team_score
        description: Final score of the home team. Includes one goal for the winner of a shootout.
      - name: away_team_id
        description: "{{ doc('team_id') }}"
      - name: away_team_score
        description: Final score of the away team. Includes one goal for the winner of a shootout.
      - name: last_period_type
        description: "{{ doc('last_period_type') }}"
      - name: fetched_at
        description: "{{ doc('fetched_at') }}"

  - name: fct_goals
    description: >
      One row per goal of a finished game, shootout goals excluded, with the situation of the goal
      (power play, short handed, empty net, penalty shot, even strength).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'event_id']
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
      - name: event_id
        description: Id of the goal event within the game's play-by-play.
      - name: team_id
        description: Team that scored the goal. Joins to `dim_teams.team_id`.
      - name: situation_code
        description: "{{ doc('situation_code') }}"
      - name: home_score
        description: Home team score right after this goal.
      - name: away_score
        description: Away team score right after this goal.
      - name: scoring_player_id
        description: Player who scored. Joins to `dim_players.player_id`.
      - name: assist1_player_id
        description: Player credited with the first assist. Null for an unassisted goal.
      - name: assist2_player_id
        description: Player credited with the second assist. Null when there is at most one assist.
      - name: period_number
        description: Period of the goal (1-3 = regulation, 4 = overtime).
      - name: time_in_period
        description: Time elapsed in the period when the goal was scored, as `MM:SS`.
      - name: time_remaining_in_period
        description: Time left in the period when the goal was scored, as `MM:SS`.
      - name: fetched_at
        description: "{{ doc('fetched_at') }}"
      - name: goal_type
        description: >
          Situation of the goal from the scoring team's point of view, worked out from situation_code.
          PS = penalty shot, EN = empty net (the other team's goalie was pulled), PPG = power play goal,
          SHG = short handed goal, EA = extra attacker (the scoring team had pulled its goalie, sides
          otherwise even), EV = even strength. A pulled goalie is not counted as a power play.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PS', 'EN', 'PPG', 'SHG', 'EA', 'EV']
      - name: strength
        description: >
          Skaters on the ice when the goal was scored, scoring team first, e.g. `5 on 4`.
          Goalies are not counted, so a team with its goalie pulled shows 6 skaters.
          `Penalty shot` for a penalty shot goal (one shooter against the goalie).

  - name: fct_games_events
    description: >
      One row per play of a finished game (shots, hits, faceoffs, penalties, goals, stoppages, shootout
      attempts...), with the players involved, the puck coordinates and the manpower situation.
      A game is replaced in full (delete+insert on game_id) when its play-by-play or its game row is reloaded.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'event_id']
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
      - name: event_id
        description: Id of the play within the game's play-by-play.
      - name: team_id
        description: Team that owns the event (e.g. the shooting or penalized team). Null for plays like stoppages.
      - name: situation_code
        description: "{{ doc('situation_code') }}"
      - name: event_type
        description: Type of play from the NHL API, e.g. `goal`, `shot-on-goal`, `hit`, `faceoff`, `penalty`.
      - name: home_score
        description: Home team score after the play. Only filled for goals.
      - name: away_score
        description: Away team score after the play. Only filled for goals.
      - name: sort_order
        description: Order of the play in the game, from the NHL API. Separates plays of the same second.
      - name: period_number
        description: Period of the play (1-3 = regulation, 4 = overtime, 5 = shootout).
      - name: period_descriptor
        description: Type of period, `REG`, `OT` or `SO`.
      - name: time_in_period
        description: Time elapsed in the period, as `MM:SS`.
      - name: time_remaining_in_period
        description: Time left in the period, as `MM:SS`.
      - name: zone_code
        description: Zone of the play from the event owner's point of view. O = offensive, D = defensive, N = neutral.
      - name: x_coord
        description: Horizontal position of the play on the rink, in feet from center ice.
      - name: y_coord
        description: Vertical position of the play on the rink, in feet from center ice.
      - name: player_1_id
        description: Main player of the play (scorer, shooter, blocker, faceoff winner, hitter, penalized player...).
      - name: player_1_desc
        description: What player_1_id did, e.g. `scoring_player_id`, `blocking_player_id`.
      - name: player_2_id
        description: Second player of the play (first assist, shooter of a blocked shot, faceoff loser, player hit, player who drew the penalty).
      - name: player_2_desc
        description: What player_2_id did.
      - name: player_3_id
        description: Third player of the play (second assist, player serving the penalty).
      - name: player_3_desc
        description: What player_3_id did.
      - name: goalie_in_net_id
        description: Goalie in net for a shot or goal. Null when the net was empty.
      - name: details
        description: The full `details` object of the play, as JSON, for the fields not parsed into columns.
      - name: situation
        description: >
          Manpower situation of the play, from the game's side (not one team's), worked out from situation_code.
          PS = penalty shot, EA = extra attacker (a team had pulled its goalie), PP = power play
          (one team had more skaters), EV = even strength.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PS', 'EA', 'PP', 'EV']
      - name: strength_adv_team
        description: Skaters on each side, the team with more skaters first, e.g. `5 on 4`. `Penalty shot` for a penalty shot.
      - name: man_adv_team_id
        description: Team with more skaters on the ice. Null when the sides are even.
      - name: fetched_at
        description: Latest load of the game, between its play-by-play and its game row.

  - name: fct_games_pp_segments
    description: >
      One row per segment of constant strength (5v5, 5v4, 4v4, 3v3...), covering the whole game up to the
      shootout. Python model: each game is replayed penalty by penalty with the NHL rules (coincidental
      penalties, double minors, goals ending minors, 3v3 overtime...), see simulate_game in
      fct_games_pp_segments.py. Pulled goalies are ignored (a 6v5 is not a power play). Incremental: the
      games with newly loaded events are replayed in full (delete+insert on game_id).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'segment_number']
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_games')
                field: game_id
      - name: segment_number
        description: Order of the segment in the game (1, 2, 3...). A new row starts each time the skater counts change.
      - name: power_play_number
        description: >
          Groups consecutive uneven segments with the same team on the power play, e.g. a 5v3 followed by a
          5v4 share one number, but 5v4, 4v4, 5v4 is two. Null at even strength.
      - name: pp_opportunities
        description: >
          Power-play opportunities credited to this segment, as the NHL counts them: each penalty served that
          gave the other team a man advantage, on the first power-play segment it overlaps, plus one after a
          power-play goal during a major that keeps going. Sum by pp_team_id for a team's opportunities.
      - name: home_team_id
        description: Home team. Joins to `dim_teams.team_id`.
      - name: away_team_id
        description: Away team. Joins to `dim_teams.team_id`.
      - name: pp_team_id
        description: Team with more skaters (on the power play). Null at even strength.
      - name: pk_team_id
        description: Team with fewer skaters (killing the penalty). Null at even strength.
      - name: situation
        description: "`Even`, `PP home` or `PP away`, depending on which team has more skaters."
      - name: strength
        description: Skaters of the home team then of the away team, e.g. `5v5`, `4v5`, `3v3`.
      - name: skaters_home
        description: Skaters of the home team during the segment (goalie not counted).
      - name: skaters_away
        description: Skaters of the away team during the segment (goalie not counted).
      - name: start_period
        description: Period when the segment starts.
      - name: start_time_in_period
        description: Time elapsed in start_period when the segment starts, as `MM:SS`.
      - name: end_period
        description: Period when the segment ends. A segment can run over two periods.
      - name: end_time_in_period
        description: Time elapsed in end_period when the segment ends, as `MM:SS`.
      - name: starting_time_seconds
        description: Start of the segment in seconds since the start of the game (period 2 starts at 1200).
      - name: ending_time_seconds
        description: End of the segment in seconds since the start of the game.
      - name: duration_seconds
        description: Length of the segment in seconds.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: fetched_at
        description: Latest load of the game's events.

  - name: fct_games_leading_segments
    description: >
      One row per stretch of a game with the same team leading, or tied, from the goals of `fct_goals`.
      Shootout goals are not in `fct_goals`, so a game going to a shootout ends tied. A reloaded game
      replaces all its rows (delete+insert on game_id).
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
      - name: state
        description: "`home_leads`, `away_leads` or `tied`."
      - name: leading_team_id
        description: Team in the lead. 0 when the score is tied.
      - name: start_s
        description: Start of the stretch in seconds since the start of the game.
      - name: end_s
        description: End of the stretch in seconds since the start of the game.
      - name: duration_s
        description: Length of the stretch in seconds.
      - name: fetched_at
        description: "{{ doc('fetched_at') }}"

  - name: fct_games_stats
    description: >
      One row per game, team and stat, in long format: a new stat is a new block in the `union all`, not a
      new column. A team with no row for a stat had none of it. A reloaded game replaces all its rows
      (delete+insert on game_id).
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
      - name: team_id
        description: "{{ doc('team_id') }}"
      - name: stat_name
        description: >
          Name of the stat: `Takeaways`, `Giveaways`, `Hits`, `Faceoffs` (faceoffs won), `Shots On Goal`,
          `Penalty Minutes`, `Power Play %`, `Power Play Goals`, `Power Play Opportunities`, `Blocked Shots`
          or `Leading time`.
      - name: stat_value
        description: >
          Value of the stat: a count, except `Penalty Minutes` (minutes), `Leading time` (seconds) and
          `Power Play %` (a rate between 0 and 1).
      - name: fetched_at
        description: Latest load of the data behind the stat.

  - name: fct_game_rosters
    description: >
      One row per player per game, for every player who dressed. A reloaded game replaces all its rows
      (delete+insert on game_id).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'player_id']
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
      - name: player_id
        description: "{{ doc('player_id') }}"
      - name: team_id
        description: Team the player dressed for in this game. Joins to `dim_teams.team_id`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: position
        description: Position code from the NHL API. C = center, L = left wing, R = right wing, D = defense, G = goalie.
      - name: sweater_number
        description: Player's jersey number in this game.
      - name: fetched_at
        description: "{{ doc('fetched_at') }}"

  - name: fct_team_travel
    description: >
      One row per team per game, with the arena the team played in and the arena of its previous game
      of the season, to follow each team's trips across the season. Rebuilt in full on every run.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['game_id', 'team_id']
    columns:
      - name: game_id
        description: "{{ doc('game_id') }}"
      - name: season
        description: "{{ doc('season') }}"
      - name: game_date
        description: "{{ doc('game_date') }}"
      - name: team_id
        description: "{{ doc('team_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: is_home
        description: True when the team played this game at home.
      - name: previous_arena_name
        description: Arena of the team's previous game this season. Null for its first game of the season.
      - name: previous_arena_latitude
        description: Latitude of the previous arena. Null for the team's first game of the season.
      - name: previous_arena_longitude
        description: Longitude of the previous arena. Null for the team's first game of the season.
      - name: arena_name
        description: Arena where this game was played, i.e. the home team's arena.
        data_tests:
          - not_null
      - name: arena_latitude
        description: Latitude of the arena where this game was played.
      - name: arena_longitude
        description: Longitude of the arena where this game was played.
      - name: distance_km
        description: >
          Straight line distance in km between the previous arena and this one (Snowflake's `haversine`).
          It is the distance as the crow flies, not the real route. 0 when the team stayed in the same arena,
          null for the team's first game of the season.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: dim_players
    description: >
      One row per player who has dressed for at least one game, with the team, sweater number and
      details of their most recent game, from the play-by-play rosters.
    columns:
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Player's first name.
      - name: last_name
        description: Player's last name.
      - name: position
        description: Position code from the NHL API. C = center, L = left wing, R = right wing, D = defense, G = goalie.
      - name: team_id
        description: >
          Team of the player's most recent game. Joins to `dim_teams.team_id`.
          Changes over time are tracked in the snapshot `nhl_players_team_snapshot`.
      - name: sweater_number
        description: Player's jersey number in their most recent game.
      - name: headshot_url
        description: URL of the player's headshot image on the NHL site.
      - name: fetched_at
        description: "{{ doc('fetched_at') }}"

  - name: dim_teams
    description: The 32 NHL teams, from the nhl_teams seed.
    columns:
      - name: team_id
        description: "{{ doc('team_id') }}"
        data_tests:
          - unique
          - not_null
      - name: conference_name
        description: Conference (Eastern or Western).
      - name: division_name
        description: Division (Atlantic, Metropolitan, Central or Pacific).
      - name: logo_url
        description: URL of the team's logo (SVG) on the NHL site.
      - name: name
        description: Full team name, e.g. Colorado Avalanche.
      - name: arena_name
        description: Current name of the team's home arena, e.g. Ball Arena. Sponsor names change over time.
        data_tests:
          - not_null
      - name: arena_longitude
        description: Longitude (WGS84, decimal degrees) of the team's home arena. Negative = west.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -180
                max_value: 180
      - name: arena_latitude
        description: Latitude (WGS84, decimal degrees) of the team's home arena.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -90
                max_value: 90
